<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMEGA LEARNING SYSTEM</title>
    <script>
      // Single Page Apps for GitHub Pages - Instant Safe Fallback
      (function() {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        if (pathSegments.length > 0 && window.location.hostname.endsWith('github.io')) {
          var repo = pathSegments[0];
          var target = window.location.origin + '/' + repo + '/';
          if (window.location.href !== target) {
            window.location.replace(target);
          }
        } else {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body>
  </body>
</html>
